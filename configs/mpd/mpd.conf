# ─────────────────────────────────────────────
# Music
# ─────────────────────────────────────────────

music_directory     "~/Music/music"
playlist_directory  "~/Music/playlists"


# ─────────────────────────────────────────────
# MPD data
# ─────────────────────────────────────────────

db_file       "~/.local/share/mpd/database"
sticker_file  "~/.local/share/mpd/sticker.sql"

state_file    "~/.local/state/mpd/state"

# Logs are handled by the systemd user journal.


# ─────────────────────────────────────────────
# Playback state
# ─────────────────────────────────────────────

restore_paused "yes"

auto_update "yes"


# ─────────────────────────────────────────────
# Audio
# ─────────────────────────────────────────────

audio_output {
    type "pulse"
    name "PipeWire"
}


# ─────────────────────────────────────────────
# Connection
# ─────────────────────────────────────────────

bind_to_address "$XDG_RUNTIME_DIR/mpd/socket"
