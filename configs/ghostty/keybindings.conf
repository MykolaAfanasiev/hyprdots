# Current screen — fast.
# Press Enter after the path appears.
keybind = ctrl+shift+y=text:\x15scrollback\x20
keybind = chain=write_screen_file:paste

# Full terminal history — slower.
# Press Enter after the path appears.
keybind = ctrl+shift+alt+y=text:\x15scrollback\x20
keybind = chain=write_scrollback_file:paste
