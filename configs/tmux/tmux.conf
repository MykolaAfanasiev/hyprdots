source-file ~/.config/tmux/modules/00-options.conf
source-file ~/.config/tmux/modules/10-keybindings.conf
source-file ~/.config/tmux/modules/20-plugins.conf

# Load fallback theme configuration.
source-file ~/.config/tmux/themes/current.conf

# Load plugins.
run-shell "/usr/share/tmux-plugin-manager/tpm"

# Override the palette with the current Hyprdots theme.
source-file -q ~/.cache/hyprdots/theme/current/tmux.conf
