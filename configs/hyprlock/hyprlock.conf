source = ./themes/current.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

background {
    monitor =

    path = ~/.cache/hyprdots/wallpaper/current-wallpaper

    color = $base

    blur_passes = 3
    blur_size = 8

    noise = 0.01
    contrast = 1.0
    brightness = 0.75
    vibrancy = 0.15
    vibrancy_darkness = 0.05
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H')"

    color = $lock_text

    font_size = 72
    font_family = JetBrainsMono Nerd Font

    position = 0, 180
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%M')"

    color = $lock_text

    font_size = 72
    font_family = JetBrainsMono Nerd Font

    position = 0, 105
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"

    color = $lock_subtext

    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, 45
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hi, $USER

    color = $lock_text

    font_size = 22
    font_family = JetBrainsMono Nerd Font

    position = 0, 120
    halign = center
    valign = bottom
}

# Password
input-field {
    monitor =

    size = 260, 46
    outline_thickness = 2

    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true

    outer_color = $lock_input_border
    inner_color = $lock_input_bg
    font_color = $lock_input_fg

    fade_on_empty = false
    placeholder_text = Password

    check_color = $lock_check
    fail_color = $lock_fail
    capslock_color = $lock_caps
    bothlock_color = $lock_caps

    position = 0, 55
    halign = center
    valign = bottom
}
