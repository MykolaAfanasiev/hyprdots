[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-tool"
version = "0.1.0"
description = "Screenshot utility for Wayland"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.scripts]
screenshot-tool = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "utils*"]
