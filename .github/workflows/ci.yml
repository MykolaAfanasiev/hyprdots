name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run static checks
        run: ./tests/static/check.sh
  installer:
    name: Installer tests
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install test dependencies
        run: |
          pacman -Syu --noconfirm \
            bash \
            git

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Arch Linux
        run: |
          cat /etc/os-release
          command -v pacman

      - name: Run installer tests
        run: ./tests/installer/run.sh
