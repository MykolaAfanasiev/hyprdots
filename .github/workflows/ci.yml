name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install shell tooling
        run: |
          SHELLCHECK_VERSION="0.11.0"
          SHFMT_VERSION="3.14.0"
          SHFMT_SHA256="sha256:fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66"

          sudo apt-get update
          sudo apt-get install --yes zsh

          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            -o /tmp/shellcheck.tar.xz

          tar -xJf /tmp/shellcheck.tar.xz -C /tmp

          sudo install \
            -m 0755 \
            "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck

          curl -fsSL \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o /tmp/shfmt

          printf '%s  %s\n' "$SHFMT_SHA256" /tmp/shfmt | sha256sum --check --status
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

          shellcheck --version
          shfmt --version
      - name: Run static checks
        run: ./tests/static/check.sh
  installer:
    name: Installer tests
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install test dependencies
        run: |
          pacman -Syu --noconfirm \
            bash \
            git \
            util-linux

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Arch Linux
        run: |
          cat /etc/os-release
          command -v pacman

      - name: Run installer tests
        run: ./tests/installer/run.sh
      - name: Debug E2E tests
        run: |
          echo "UID=$(id -u)"
          echo "USER=$(id -un)"

          command -v script || true
          command -v setpriv || true

          script --version || true
          setpriv --version || true

          bash -x tests/installer/e2e/full-install.sh
          bash -x tests/installer/e2e/preflight-failure.sh
